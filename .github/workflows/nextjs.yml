name: Deploy Frontend to GitHub Pages

on:
  # Tự động chạy khi bạn push code lên nhánh main
  push:
    branches: ["main"]

  # Cho phép bấm nút chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Cấp quyền cho GitHub Actions deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh xung đột các đợt deploy liên tiếp
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Cài đặt dependencies (thư mục frontend)
        working-directory: frontend
        run: npm ci

      - name: Build ứng dụng Vite React
        working-directory: frontend
        env:
          VITE_API_URL: https://quizzizforyou.onrender.com
        run: npm run build

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact bản build
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
